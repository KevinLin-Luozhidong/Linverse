name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Summarize dependency audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a = require("/tmp/npm-audit.json"); const out = Object.fromEntries(Object.entries(a.vulnerabilities || {}).map(([name, v]) => [name, {severity: v.severity, via: v.via.map(x => typeof x === "string" ? x : x.title), fixAvailable: v.fixAvailable}])); console.log(JSON.stringify({metadata: a.metadata?.vulnerabilities, vulnerabilities: out}, null, 2))'
      - name: Build frontend
        run: npm run build --workspace=frontend
      - name: Check backend JavaScript syntax
        run: find backend -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend security tests
        run: npm test --workspace=backend
