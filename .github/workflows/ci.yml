name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build --workspace=frontend
      - name: Check backend JavaScript syntax
        run: find backend -type f -name '*.js' -print0 | xargs -0 -n1 node --check
