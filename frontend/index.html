<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <!-- 主屏幕图标：iOS 添加到主屏幕时用这张，不再显示灰色默认图 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 以网页 App 方式打开：全屏、无浏览器地址栏 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Linverse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Linverse</title>
    <style>
      /* 原生启动屏：JS 还没跑起来时先显示品牌，避免白屏干等（开屏太长的体感来源） */
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f2f7ff; z-index: 9999; }
      @media (prefers-color-scheme: dark) { #splash { background: #0b1220; } }
      #splash .t { font-size: 34px; font-weight: 800; letter-spacing: 3px; color: #1e3a5f; font-family: -apple-system, 'PingFang SC', sans-serif; }
      @media (prefers-color-scheme: dark) { #splash .t { color: #a9cdee; } }
      #splash .s { font-size: 14px; color: #7b8aa0; letter-spacing: 6px; }
      #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #d7e6fa; overflow: hidden; }
      @media (prefers-color-scheme: dark) { #splash .bar { background: #1d2942; } }
      #splash .bar i { display: block; height: 100%; width: 40%; border-radius: 2px; background: #3b82f6; animation: sp 1s ease-in-out infinite; }
      @keyframes sp { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    </style>
  </head>
  <body>
    <div id="splash"><div class="t">Linverse</div><div class="bar"><i></i></div><div class="s">学习宇宙</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // React 跑起来后第一时间撤掉启动屏
      window.__hideSplash = function () { var s = document.getElementById('splash'); if (s) s.remove(); };
      // 兜底：15 秒 JS 还没跑起来（网络太差下载失败），显示重试提示，别让用户对着 Linverse 干等
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s && !window.__reactBooted) {
          s.innerHTML = '<div class="t">Linverse</div><div class="s" style="letter-spacing:2px">网络太慢没加载出来，点我重试</div>';
          s.style.cursor = 'pointer';
          s.onclick = function () { location.reload(); };
        }
      }, 15000);
    </script>
  </body>
</html>
